<!doctype html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1584px; height: 396px; overflow: hidden; }

    header { position: absolute; top: 32px; left: 330px; right: 34px; display: flex; align-items: center; }
    .monogram { font-size: 32px; font-weight: 700; letter-spacing: -3px; }
    .monogram span { color: #bd1f3a; }

    .name { font-size: 18px; font-weight: 600; letter-spacing: -.5px; }
    .role { margin-top: 5px; font: 9px 'DM Mono', monospace; letter-spacing: 1.8px; text-transform: uppercase; }
    .name-label { font: 500 12px 'DM Mono', monospace; letter-spacing: 1.5px; }
    .kicker { position: absolute; left: 333px; top: 110px; margin: 0; font: 9px 'DM Mono', monospace; letter-spacing: 2px; text-transform: uppercase; }
    .kicker::before { content: ''; display: inline-block; width: 7px; height: 7px; background: #bd1f3a; border-radius: 50%; margin-right: 10px; }
    h1 { position: absolute; left: 326px; top: 128px; margin: 0; font-size: 72px; line-height: 1.04; letter-spacing: -4px; font-weight: 700; }

    .intro { position: absolute; top: 291px; left: 333px; margin: 0; font-size: 17px; line-height: 1.5; letter-spacing: -.25px; color: #484840; }
    .intro br { display: none; }
    footer { position: absolute; left: 333px; bottom: 24px; width: 745px; border-top: 1px solid #15151533; padding-top: 13px; display: flex; justify-content: space-between; align-items: center; font: 11px 'DM Mono', monospace; letter-spacing: .7px; }
    .disciplines { display: flex; gap: 15px; align-items: center; }
    .disciplines b { color: #bd1f3a; font-size: 13px; font-weight: 400; }
    .web { font-size: 11px; letter-spacing: -.25px; }
    .art-label { position: absolute; bottom: 26px; right: 28px; width: 370px; display: flex; justify-content: space-between; font: 8px 'DM Mono', monospace; color: #f1eee6a8; letter-spacing: 1.3px; }
    .banner::after { content: ''; position: absolute; left: 0; top: 0; width: 315px; height: 396px; background: radial-gradient(circle at 0% 0%, #d6ff3e55, transparent 80%); pointer-events: none; }
  </style>
</head>

    <header>
